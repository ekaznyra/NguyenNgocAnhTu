name: Scheduled Dead Link Audit

on:
  schedule:
    # Chạy vào 00:00 Chủ Nhật hàng tuần (UTC)
    - cron: '0 0 * * 0'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  audit-links:
    name: Audit Remote Script & Rule Links
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Audit Remote Links
        run: python scripts/audit_links.py

      - name: Alert Issue on Dead Links
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: '🚨 Cảnh báo: Phát hiện liên kết bị chết (404 Dead Link) trong Module/Rules',
              body: 'Hệ thống tự động phát hiện một hoặc nhiều liên kết script/rule bên thứ ba bị 404 hoặc không phản hồi trong lần kiểm toán định kỳ.\n\nVui lòng kiểm tra log workflow của job `Audit Remote Script & Rule Links` để ghim lại commit SHA hoặc thay thế link dự phòng.'
            });
